<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Generator V2</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Segoe UI,sans-serif;
    background:#f4f4f4;
}

.panel{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

label{
    display:block;
    margin-top:10px;
}

select,input{
    width:100%;
    padding:8px;
}

button{
    margin-top:20px;
    padding:12px;
    width:100%;
    background:#1f6feb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

svg{
    width:100%;
    background:white;
    border-radius:12px;
}
</style>
</head>
<body>

<div class="panel">

<h2>House Generator V2</h2>

<label>Shape</label>
<select id="shape">
<option value="auto">Auto</option>
<option value="rectangle">Rectangle</option>
<option value="l">L Shape</option>
<option value="t">T Shape</option>
<option value="u">U Shape</option>
<option value="h">H Shape</option>
<option value="courtyard">Courtyard</option>
</select>

<label>Bedrooms</label>
<input id="bedrooms" type="number" value="3">

<label>Bathrooms</label>
<input id="bathrooms" type="number" value="2">

<label>Width (ft)</label>
<input id="width" type="number" value="60">

<label>Depth (ft)</label>
<input id="depth" type="number" value="40">

<label>
<input type="checkbox" id="garage" checked>
Garage
</label>

<button onclick="generateHouse()">
Generate House
</button>

</div>

<div class="panel">

<div id="info"></div>

<svg
    id="plan"
    viewBox="0 0 1000 800">
</svg>

</div>
<script>

function chooseShape(){

    let shape =
        document.getElementById("shape").value;

    if(shape !== "auto")
        return shape;

    let beds =
        Number(document.getElementById("bedrooms").value);

    let garage =
        document.getElementById("garage").checked;

    if(beds >= 5)
        return "u";

    if(garage)
        return "l";

    return "rectangle";
}

function generateFootprint(shape,w,d){

    switch(shape){

        case "l":

            return [

                {
                    x:0,
                    y:0,
                    w:w,
                    h:d
                },

                {
                    x:w*0.65,
                    y:d*0.55,
                    w:w*0.35,
                    h:d*0.45
                }

           ];

        case "t":

            return [

                {
                    x:0,
                    y:0,
                    w:w,
                    h:d*0.35
                },

                {
                    x:w*0.3,
                    y:d*0.35,
                    w:w*0.4,
                    h:d*0.65
                }

            ];

        case "u":

            return [

                {
                    x:0,
                    y:0,
                    w:w*0.3,
                    h:d
                },

                {
                    x:w*0.7,
                    y:0,
                    w:w*0.3,
                    h:d
                },

                {
                    x:0,
                    y:0,
                    w:w,
                    h:d*0.3
                }

            ];

        case "h":

            return [

                {
                    x:0,
                    y:0,
                    w:w*0.25,
                    h:d
                },

                {
                    x:w*0.75,
                    y:0,
                    w:w*0.25,
                    h:d
                },

                {
                    x:0,
                    y:d*0.4,
                    w:w,
                    h:d*0.2
                }

            ];

        case "courtyard":

            return [

                {
                    x:0,
                    y:0,
                    w:w,
                    h:d
                }

            ];

        default:

            return [

                {
                    x:0,
                    y:0,
                    w:w,
                    h:d
                }

            ];
    }
}
<script>

function generateRooms(){

    let rooms = [];

    rooms.push({
        name:"Living",
        color:"#dbeafe"
    });

    rooms.push({
        name:"Kitchen",
        color:"#fde68a"
    });

    rooms.push({
        name:"Dining",
        color:"#bbf7d0"
    });

    let beds =
        Number(document.getElementById("bedrooms").value);

    for(let i=1;i<=beds;i++){

        rooms.push({
            name:"Bedroom "+i,
            color:"#f5d0fe"
        });
    }

    return rooms;
}
<script>

function drawFootprint(parts,w,d){

    const svg =
        document.getElementById("plan");

    svg.innerHTML = "";

    const scale = 10;

    parts.forEach(p=>{

        let rect =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "rect"
            );

        rect.setAttribute(
            "x",
            p.x*scale+50
        );

        rect.setAttribute(
            "y",
            p.y*scale+50
        );

        rect.setAttribute(
            "width",
            p.w*scale
        );

        rect.setAttribute(
            "height",
            p.h*scale
        );

        rect.setAttribute(
            "fill",
            "#fff"
        );

        rect.setAttribute(
            "stroke",
            "#000"
        );

        rect.setAttribute(
            "stroke-width",
            "3"
        );

        svg.appendChild(rect);
    });

}
<script>

function addGarage(parts,w,d){

    if(
        !document.getElementById("garage")
        .checked
    ){
        return;
    }

    parts.push({

        x:w,
        y:d*0.3,

        w:18,
        h:22,

        garage:true

    });

}
<script>

function generateHouse(){

    const w =
        Number(
            document.getElementById("width").value
        );

    const d =
        Number(
            document.getElementById("depth").value
        );

    const shape =
        chooseShape();

    let footprint =
        generateFootprint(
            shape,
            w,
            d
        );

    addGarage(
        footprint,
        w,
        d
    );

    drawFootprint(
        footprint,
        w,
        d
    );

    document
        .getElementById("info")
        .innerHTML =

        "<h3>"+shape.toUpperCase()+" FOOTPRINT</h3>" +

        "<p>"+footprint.length+
        " footprint sections generated</p>";
}

generateHouse();

</script>

</body>
</html>
