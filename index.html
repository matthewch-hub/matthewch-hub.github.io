<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchPlan Studio</title>
<style>
:root{--bg:#f8fafc;--panel:#ffffff;--text:#0f172a;--sub:#475569;--line:#cbd5e1;--accent:#2563eb;--accent-soft:#eff6ff;--bad:#dc2626;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f19;--panel:#111827;--text:#f8fafc;--sub:#cbd5e1;--line:#334155;--accent:#60a5fa;--accent-soft:#1e3a8a44;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:12.5px}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.layout{display:block}
.sidebar{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.stage{padding:14px}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 51px)}
  .sidebar{overflow-y:auto;border-right:1px solid var(--line);border-bottom:none}
  .stage{overflow-y:auto}
}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub)}
.field{display:flex;flex-direction:column;gap:4px;transition:opacity .15s}
.field.off{opacity:.4}
.field label{display:flex;justify-content:space-between;font-weight:600;font-size:12.5px;color:var(--sub)}
.field output{font-family:ui-monospace,monospace;color:var(--accent)}
select,input[type=range]{width:100%}
select{padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label,.modes label{display:flex;gap:6px;align-items:center;cursor:pointer}
.modes{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--accent-soft);border-radius:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.sheet h2{font-size:17px}
.sheet .sub{color:var(--sub);font-size:12.5px;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.metric{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.metric b{display:block;font-family:ui-monospace,monospace;font-size:16px}
.metric span{font-size:11px;color:var(--sub);text-transform:uppercase}
.floor-label{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--sub);margin:10px 0 4px}
.notes{display:grid;gap:8px;margin-top:12px}
.note{border-left:3px solid var(--accent);background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;color:var(--sub);font-size:12.5px}
.error{color:var(--bad);padding:16px}
@media print{header,.sidebar,.tabs{display:none!important}.layout{display:block;height:auto}.stage{overflow:visible}.sheet{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>ArchPlan Studio</h1>
  <div class="row">
    <button class="btn active" id="unitImperial" type="button">Feet</button>
    <button class="btn" id="unitMetric" type="button">Metres</button>
    <button class="btn" id="saveJson" type="button">Save JSON</button>
    <button class="btn" id="printPage" type="button">Print / PDF</button>
  </div>
</header>

<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="modes">
    <h3>Step 1 · Size the house by</h3>
    <label><input type="radio" name="sizeMode" value="area" checked> Total living area</label>
    <label><input type="radio" name="sizeMode" value="dims"> Width and depth</label>
  </div>

  <div class="field" id="areaField">
    <label>Living area (garage not counted) <output id="areaOut"></output></label>
    <input type="range" id="area" min="500" max="5600" step="25" value="2100">
  </div>
  <div class="field" id="widthField">
    <label>Overall width (includes garage) <output id="widthOut"></output></label>
    <input type="range" id="width" min="24" max="100" step="1" value="70">
  </div>
  <div class="field" id="depthField">
    <label>Overall depth <output id="depthOut"></output></label>
    <input type="range" id="depth" min="26" max="90" step="1" value="40">
  </div>

  <h3>Rooms needed</h3>
  <div class="two">
    <div class="field"><label>Bedrooms</label><select id="bedrooms"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
    <div class="field"><label>Bathrooms</label><select id="bathrooms"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
    <div class="field"><label>Levels</label><select id="levels"><option value="1" selected>1 story</option><option value="2">2 stories</option></select></div>
    <div class="field"><label>Garage</label><select id="garage"><option value="0">None</option><option value="1">1-car</option><option value="2" selected>2-car</option></select></div>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="office" checked> Home office</label>
    <label><input type="checkbox" id="mudroom" checked> Mudroom</label>
    <label><input type="checkbox" id="pantry" checked> Pantry</label>
    <label><input type="checkbox" id="gym"> Gym / flex</label>
    <label><input type="checkbox" id="adaptable"> Adaptable living</label>
  </div>

  <h3>Budget</h3>
  <div class="field"><label>Target budget <output id="budgetOut"></output></label><input type="range" id="budget" min="100000" max="2000000" step="25000" value="475000"></div>
  <div class="field"><label>Finish level</label><select id="finish"><option value="standard">Standard</option><option value="mid" selected>Mid-range</option><option value="high">High-end</option></select></div>
</aside>

<main class="stage">
  <div class="tabs" id="tabs"></div>
  <div id="mount"></div>
</main>
</div>

<script>
/* =====================================================================
   ArchPlan Studio
   How a plan is made:
     1. Read the settings the user chose.
     2. Build the ROOM PROGRAM: which rooms exist and how big each should be.
     3. Work out the ENVELOPE (overall width and depth) from the program.
     4. Pack the rooms into two rows on either side of a central hallway.
        Every room touches the hall, so the path of travel is short and clear.
     5. Place doors, then mirror the plan to produce the other options.
   ===================================================================== */

const FEET_TO_METERS = 0.3048;
const SQFT_TO_SQM = 0.092903;
const GARAGE_DEPTH = 20;
const MIN_ROW_DEPTH = 8;
const HALL_STANDARD = 3.5;
const HALL_ADAPTABLE = 4.5;
const COST_PER_SQFT = { standard: 155, mid: 215, high: 320 };

/* The four options are the same room arrangement, flipped in different directions. */
const VARIANTS = [
  { name: 'Option A', flipX: false, flipY: false },
  { name: 'Option B', flipX: true,  flipY: false },
  { name: 'Option C', flipX: false, flipY: true  },
  { name: 'Option D', flipX: true,  flipY: true  }
];

const ROOM_COLORS = {
  entry: '#fdf6e3', public: '#fdf6e3', sleep: '#e8f1fb', wet: '#e3f6f5',
  storage: '#f1f1f1', service: '#f1efe7', garage: '#e5e7eb', flex: '#f3ecfb', hall: '#ffffff'
};

let useMetric = false;
let activeTab = 0;
let plans = [];

/* ---------------- formatting helpers ---------------- */

function formatLength(feet) {
  if (useMetric) return (feet * FEET_TO_METERS).toFixed(1) + ' m';
  let wholeFeet = Math.floor(feet);
  let inches = Math.round((feet - wholeFeet) * 12);
  if (inches === 12) { wholeFeet++; inches = 0; }
  return wholeFeet + "'" + (inches ? inches + '"' : '');
}

function formatArea(sqft) {
  if (useMetric) return Math.round(sqft * SQFT_TO_SQM).toLocaleString() + ' m²';
  return Math.round(sqft).toLocaleString() + ' sq ft';
}

function formatMoney(amount) {
  return amount >= 1e6 ? '$' + (amount / 1e6).toFixed(2) + 'M' : '$' + Math.round(amount / 1000) + 'k';
}

function sumArea(rooms) {
  return rooms.reduce((total, room) => total + room.area, 0);
}

/* ---------------- step 2: the room program ---------------- */

/* Creates one room request. "area" is the target size in sq ft, "minSide" the shortest acceptable side. */
function makeRoom(name, type, area, minSide, extra) {
  return Object.assign({ name: name, type: type, area: area, minSide: minSide }, extra || {});
}

/* If one row of a floor is much bigger than the other, add a flex room to the smaller row to even them out. */
function balanceRows(floor, fillerName) {
  const northArea = sumArea(floor.north);
  const southArea = sumArea(floor.south);
  const difference = Math.abs(northArea - southArea);
  if (difference > 0.15 * (northArea + southArea)) {
    const smallerRow = northArea < southArea ? floor.north : floor.south;
    smallerRow.push(makeRoom(fillerName, 'flex', difference * 0.7, 8));
  }
}

/* Returns a list of floors. Each floor has a "north" row and a "south" row of rooms. */
function buildProgram(settings, garageWidth) {
  const grow = settings.adaptable ? 1.15 : 1;   /* adaptable rooms are 15% larger */
  const hasGarage = garageWidth > 0;
  const makeStairs = () => makeRoom('Stairs', 'storage', 55, 4, { fixedW: 5 });

  /* Public rooms */
  const diningArea = settings.bedrooms <= 2 ? 100 : settings.bedrooms === 3 ? 120 : 140;
  const foyer   = makeRoom('Foyer', 'entry', 48, 5);
  const living  = makeRoom('Living', 'public', 200 * grow, 12);
  const dining  = makeRoom('Dining', 'public', diningArea * grow, 9);
  const kitchen = makeRoom('Kitchen', 'public', 130 * grow, 9);
  const pantry  = settings.pantry ? makeRoom('Pantry', 'storage', 30, 4, { joinTo: 'Kitchen' }) : null;
  const office  = settings.office ? makeRoom('Office', 'flex', 100, 9) : null;
  const gym     = settings.gym ? makeRoom('Gym/Flex', 'flex', 110, 9) : null;

  /* Service rooms. With a garage, the garage and the mudroom/laundry share the same column width. */
  const garage  = hasGarage ? makeRoom('Garage', 'garage', garageWidth * GARAGE_DEPTH, 10, { fixedW: garageWidth }) : null;
  const mudroom = settings.mudroom ? makeRoom('Mudroom', 'service', 45, 5) : null;
  const laundry = makeRoom('Laundry', 'service', 48, 5);
  if (hasGarage) {
    const serviceArea = (mudroom ? mudroom.area : 0) + laundry.area;
    if (mudroom) {
      mudroom.fixedW = garageWidth * mudroom.area / serviceArea;
      laundry.fixedW = garageWidth - mudroom.fixedW;
    } else {
      laundry.fixedW = garageWidth;
    }
  }
  const serviceFront = hasGarage ? [mudroom, laundry] : [];
  const serviceBack = hasGarage ? [] : [mudroom, laundry];

  /* Private rooms: the primary suite, then bedrooms and bathrooms alternating */
  const primarySuite = [
    makeRoom('Walk-in Closet', 'storage', 35, 5, { joinTo: 'Primary' }),
    makeRoom('Primary', 'sleep', 121 * grow, 10.5),
    settings.bathrooms >= 2 ? makeRoom('Ensuite', 'wet', 60 * grow, 6.5, { joinTo: 'Primary' }) : null
  ];
  const bedAreas = [110, 100, 100, 100];
  const bedroomCount = settings.bedrooms - 1;
  const bathCount = settings.bathrooms >= 2 ? settings.bathrooms - 1 : 1;
  const secondary = [];
  for (let i = 0; i < Math.max(bedroomCount, bathCount); i++) {
    if (i < bedroomCount) secondary.push(makeRoom('Bed ' + (i + 2), 'sleep', bedAreas[i] * grow, 9));
    if (i < bathCount) secondary.push(makeRoom('Bath', 'wet', 45 * grow, 5));
  }

  const floors = [];
  if (settings.levels === 1) {
    floors.push({
      label: 'Floor plan', hasGarage: hasGarage,
      north: [garage, foyer, living, dining, kitchen, pantry, office].filter(Boolean),
      south: [].concat(serviceFront, primarySuite, secondary, [gym], serviceBack).filter(Boolean)
    });
    balanceRows(floors[0], 'Flex Room');
  } else {
    floors.push({
      label: 'Ground level', hasGarage: hasGarage,
      north: [garage, foyer, living, dining, kitchen, pantry].filter(Boolean),
      south: [].concat(serviceFront, [makeStairs(), makeRoom('Powder', 'wet', 25, 4), office, gym], serviceBack).filter(Boolean)
    });
    floors.push({
      label: 'Upper level', hasGarage: false,
      north: primarySuite.filter(Boolean),
      south: [makeStairs()].concat(secondary)
    });
    balanceRows(floors[0], 'Flex Room');
    balanceRows(floors[1], 'Loft');
  }
  return floors;
}

/* ---------------- step 3: the envelope comes FROM the program ---------------- */

function computeEnvelope(settings, garageWidth) {
  const minDepth = garageWidth > 0 ? GARAGE_DEPTH + MIN_ROW_DEPTH + HALL_ADAPTABLE + 2 : 26;
  const roundHalf = value => Math.round(value * 2) / 2;
  let depth, mainWidth;
  if (settings.sizeMode === 'area') {
    const areaPerFloor = settings.area / settings.levels;
    depth = Math.max(minDepth, Math.sqrt(areaPerFloor / 1.35));   /* aim for a 1.35 : 1 rectangle */
    mainWidth = Math.max(18, areaPerFloor / depth);
  } else {
    depth = Math.max(minDepth, settings.depth);
    mainWidth = Math.max(18, settings.width - garageWidth);
  }
  depth = roundHalf(depth);
  mainWidth = roundHalf(mainWidth);
  return { W: mainWidth + garageWidth, D: depth, mainWidth: mainWidth };
}

/* ---------------- step 4: pack rooms around a central hall ---------------- */

function layoutFloor(floor, depth, startX, rowWidth, hallWidth) {
  const usableDepth = depth - hallWidth;
  const northArea = sumArea(floor.north);
  const southArea = sumArea(floor.south);
  let northDepth = usableDepth * northArea / (northArea + southArea);
  if (floor.hasGarage) northDepth = Math.max(northDepth, GARAGE_DEPTH);
  northDepth = Math.max(MIN_ROW_DEPTH, Math.min(northDepth, usableDepth - MIN_ROW_DEPTH));

  const placed = [];
  /* Rooms with a fixed width keep it; the rest share what is left in proportion to their area. */
  function placeRow(row, y, rowDepth, rowName) {
    const fixedTotal = row.reduce((t, r) => t + (r.fixedW || 0), 0);
    const flexArea = row.reduce((t, r) => t + (r.fixedW ? 0 : r.area), 0);
    let x = startX;
    row.forEach(room => {
      const width = room.fixedW || (rowWidth - fixedTotal) * room.area / flexArea;
      placed.push(Object.assign({}, room, { x: x, y: y, w: width, h: rowDepth, row: rowName }));
      x += width;
    });
  }
  placeRow(floor.north, 0, northDepth, 'north');
  placeRow(floor.south, northDepth + hallWidth, depth - northDepth - hallWidth, 'south');
  placed.push({ name: 'Hall', type: 'hall', x: startX, y: northDepth, w: rowWidth, h: hallWidth, row: null });
  return placed;
}

/* ---------------- step 5: doors ---------------- */

/* A door is a short segment on a wall, plus (nx, ny): the direction the door swings. */
function placeDoors(rooms, isGround, hallWidth) {
  const doors = [];
  const doorWidth = hallWidth > HALL_STANDARD ? 3 : 2.67;
  const findRoom = name => rooms.find(r => r.name === name);

  rooms.filter(r => r.row).forEach(room => {
    const centerX = room.x + room.w / 2;
    const centerY = room.y + room.h / 2;
    const joined = room.joinTo ? findRoom(room.joinTo) : null;

    if (joined) {
      /* Closets, ensuites and pantries open into their parent room, not the hall */
      const roomIsRight = joined.x < room.x;
      const wallX = roomIsRight ? room.x : room.x + room.w;
      const width = Math.min(doorWidth, room.h - 1);
      doors.push({ x1: wallX, y1: centerY - width / 2, x2: wallX, y2: centerY + width / 2, nx: roomIsRight ? 1 : -1, ny: 0, kind: 'inner' });
    } else {
      const width = Math.min(doorWidth, room.w - 1);
      if (width >= 1.5) {
        const wallY = room.row === 'north' ? room.y + room.h : room.y;
        doors.push({ x1: centerX - width / 2, y1: wallY, x2: centerX + width / 2, y2: wallY, nx: 0, ny: room.row === 'north' ? -1 : 1, kind: 'inner' });
      }
    }

    if (isGround && room.name === 'Foyer') {
      doors.push({ x1: centerX - 1.5, y1: room.y, x2: centerX + 1.5, y2: room.y, nx: 0, ny: 1, kind: 'entry' });
    }
    if (isGround && room.type === 'garage') {
      const overheadWidth = Math.max(8, room.w - 4);
      doors.push({ x1: centerX - overheadWidth / 2, y1: room.y, x2: centerX + overheadWidth / 2, y2: room.y, nx: 0, ny: 1, kind: 'garage' });
    }
  });
  return doors;
}

/* Mirrors a finished floor left-right and/or top-bottom to create another option. */
function flipFloor(floor, envelope, variant) {
  const copy = JSON.parse(JSON.stringify(floor));
  const mapX = x => variant.flipX ? envelope.W - x : x;
  const mapY = y => variant.flipY ? envelope.D - y : y;
  copy.rooms.forEach(r => {
    const x0 = mapX(r.x), x1 = mapX(r.x + r.w), y0 = mapY(r.y), y1 = mapY(r.y + r.h);
    r.x = Math.min(x0, x1); r.w = Math.abs(x1 - x0);
    r.y = Math.min(y0, y1); r.h = Math.abs(y1 - y0);
  });
  copy.doors.forEach(d => {
    d.x1 = mapX(d.x1); d.x2 = mapX(d.x2); d.y1 = mapY(d.y1); d.y2 = mapY(d.y2);
    if (variant.flipX) d.nx = -d.nx;
    if (variant.flipY) d.ny = -d.ny;
  });
  return copy;
}

/* ---------------- results: areas, size checks, cost ---------------- */

function summarize(floors, settings) {
  const rooms = [].concat.apply([], floors.map(f => f.rooms));
  const area = list => list.reduce((t, r) => t + r.w * r.h, 0);
  const livingArea = area(rooms.filter(r => r.type !== 'garage'));
  const garageArea = area(rooms.filter(r => r.type === 'garage'));
  const hallArea = area(rooms.filter(r => r.type === 'hall'));
  const checked = rooms.filter(r => r.minSide);
  const failed = checked.filter(r => Math.min(r.w, r.h) < r.minSide - 0.3);
  const rate = COST_PER_SQFT[settings.finish];
  const cost = Math.round((livingArea * rate + garageArea * rate * 0.4) / 1000) * 1000;
  return {
    livingArea: livingArea, garageArea: garageArea,
    hallPercent: Math.round(hallArea / Math.max(livingArea, 1) * 100),
    roomCount: checked.length, passCount: checked.length - failed.length,
    failedNames: failed.map(r => r.name), cost: cost, overBudget: cost - settings.budget
  };
}

function describeVariant(variant, hasGarage) {
  const entrySide = variant.flipY ? 'south' : 'north';
  const garageSide = variant.flipX ? 'east' : 'west';
  return 'Entry on the ' + entrySide + (hasGarage ? ', garage on the ' + garageSide : '');
}

function buildNotes(plan) {
  const s = plan.settings, m = plan.summary, notes = [];
  notes.push('Path of travel: the entry foyer opens onto a central hall that reaches every room, so no room is a walk-through.');
  if (s.garage > 0) notes.push('The garage opens to the hall, with the mudroom and laundry directly beside it.');
  const stretch = (m.livingArea) / plan.programArea;
  if (stretch > 1.35) notes.push('Rooms are about ' + Math.round((stretch - 1) * 100) + '% larger than their standard sizes. Add rooms or raise the room count to use the extra space.');
  if (stretch < 0.9) notes.push('This program normally needs about ' + formatArea(plan.programArea) + ', so some rooms are squeezed. Increase the size or remove a room.');
  if (m.failedNames.length) notes.push('Below minimum size: ' + m.failedNames.slice(0, 4).join(', ') + '.');
  if (plan.depthRaised) notes.push('Depth was raised to fit the garage and both room rows.');
  if (s.adaptable) notes.push('Adaptable mode: rooms are 15% larger, the hall is wider, and doors are 36 in wide.');
  return notes;
}

/* ---------------- build every option ---------------- */

function buildAllPlans(settings) {
  const garageWidth = settings.garage === 2 ? 20 : settings.garage === 1 ? 12 : 0;
  const envelope = computeEnvelope(settings, garageWidth);
  const hallWidth = settings.adaptable ? HALL_ADAPTABLE : HALL_STANDARD;
  const program = buildProgram(settings, garageWidth);
  const programArea = program.reduce((t, f) => t + sumArea(f.north.concat(f.south).filter(r => r.type !== 'garage')), 0);

  const baseFloors = program.map((floor, index) => {
    const startX = index === 0 ? 0 : garageWidth;
    const rowWidth = index === 0 ? envelope.W : envelope.mainWidth;
    const rooms = layoutFloor(floor, envelope.D, startX, rowWidth, hallWidth);
    return { label: floor.label, rooms: rooms, doors: placeDoors(rooms, index === 0, hallWidth) };
  });

  const depthRaised = settings.sizeMode === 'dims' && envelope.D > settings.depth;
  return VARIANTS.map(variant => {
    const floors = baseFloors.map(f => flipFloor(f, envelope, variant));
    const plan = {
      variant: variant, envelope: envelope, floors: floors, settings: settings,
      programArea: programArea, depthRaised: depthRaised,
      subtitle: describeVariant(variant, garageWidth > 0),
      summary: summarize(floors, settings)
    };
    plan.notes = buildNotes(plan);
    return plan;
  });
}

/* ===== UI ===== (everything below touches the page) */

const $ = id => document.getElementById(id);

function readSettings() {
  return {
    sizeMode: document.querySelector('input[name=sizeMode]:checked').value,
    area: +$('area').value, width: +$('width').value, depth: +$('depth').value,
    bedrooms: +$('bedrooms').value, bathrooms: +$('bathrooms').value,
    levels: +$('levels').value, garage: +$('garage').value,
    office: $('office').checked, mudroom: $('mudroom').checked, pantry: $('pantry').checked,
    gym: $('gym').checked, adaptable: $('adaptable').checked,
    budget: +$('budget').value, finish: $('finish').value
  };
}

/* Greys out whichever size inputs are not in use. */
function applySizeMode() {
  const byArea = document.querySelector('input[name=sizeMode]:checked').value === 'area';
  $('area').disabled = !byArea;
  $('width').disabled = byArea;
  $('depth').disabled = byArea;
  $('areaField').classList.toggle('off', !byArea);
  $('widthField').classList.toggle('off', byArea);
  $('depthField').classList.toggle('off', byArea);
}

function updateLabels() {
  $('areaOut').textContent = formatArea(+$('area').value);
  $('widthOut').textContent = formatLength(+$('width').value);
  $('depthOut').textContent = formatLength(+$('depth').value);
  $('budgetOut').textContent = formatMoney(+$('budget').value);
}

/* Draws one floor as SVG. */
function floorSvg(floor, envelope) {
  const scale = Math.min(400 / envelope.W, 340 / envelope.D);
  const offsetX = (450 - envelope.W * scale) / 2, offsetY = 34;
  const X = x => offsetX + x * scale, Y = y => offsetY + y * scale;
  const height = Math.round(envelope.D * scale + offsetY + 16);
  let svg = '<svg width="100%" viewBox="0 0 450 ' + height + '" role="img" style="background:#fff;border-radius:8px"><title>' + floor.label + '</title>';

  floor.rooms.forEach(r => {
    svg += '<rect x="' + X(r.x).toFixed(1) + '" y="' + Y(r.y).toFixed(1) + '" width="' + (r.w * scale).toFixed(1) + '" height="' + (r.h * scale).toFixed(1) + '" fill="' + ROOM_COLORS[r.type] + '" stroke="#64748b" stroke-width="1"/>';
    const wide = r.w * scale, tall = r.h * scale;
    const cx = X(r.x + r.w / 2), cy = Y(r.y + r.h / 2);
    if (r.type === 'hall') {
      if (wide > 60) svg += '<text x="' + cx.toFixed(1) + '" y="' + cy.toFixed(1) + '" font-size="8" text-anchor="middle" dominant-baseline="central" fill="#94a3b8">HALL</text>';
    } else if (wide > 46 && tall > 28) {
      svg += '<text x="' + cx.toFixed(1) + '" y="' + (cy - 4).toFixed(1) + '" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#0f172a">' + r.name + '</text>';
      svg += '<text x="' + cx.toFixed(1) + '" y="' + (cy + 8).toFixed(1) + '" font-size="8" font-family="monospace" text-anchor="middle" dominant-baseline="central" fill="#475569">' + formatLength(r.w) + '×' + formatLength(r.h) + '</text>';
    } else if (wide > 20 && tall > 14) {
      svg += '<text x="' + cx.toFixed(1) + '" y="' + cy.toFixed(1) + '" font-size="8" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#0f172a">' + r.name.slice(0, 4) + '</text>';
    }
  });

  /* Outer walls */
  const minX = Math.min.apply(null, floor.rooms.map(r => r.x)), maxX = Math.max.apply(null, floor.rooms.map(r => r.x + r.w));
  const minY = Math.min.apply(null, floor.rooms.map(r => r.y)), maxY = Math.max.apply(null, floor.rooms.map(r => r.y + r.h));
  svg += '<rect x="' + X(minX).toFixed(1) + '" y="' + Y(minY).toFixed(1) + '" width="' + ((maxX - minX) * scale).toFixed(1) + '" height="' + ((maxY - minY) * scale).toFixed(1) + '" fill="none" stroke="#0f172a" stroke-width="3.5"/>';

  /* Doors */
  floor.doors.forEach(d => {
    const ax = X(d.x1), ay = Y(d.y1), bx = X(d.x2), by = Y(d.y2);
    if (d.kind === 'garage') {
      svg += '<rect x="' + Math.min(ax, bx).toFixed(1) + '" y="' + (ay - 3).toFixed(1) + '" width="' + Math.abs(bx - ax).toFixed(1) + '" height="6" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>';
      return;
    }
    const leaf = Math.hypot(d.x2 - d.x1, d.y2 - d.y1);
    const tipX = X(d.x1 + d.nx * leaf), tipY = Y(d.y1 + d.ny * leaf);
    const radius = leaf * scale;
    const cross = (bx - ax) * (tipY - ay) - (by - ay) * (tipX - ax);
    const color = d.kind === 'entry' ? '#2563eb' : '#0f172a';
    svg += '<line x1="' + ax.toFixed(1) + '" y1="' + ay.toFixed(1) + '" x2="' + bx.toFixed(1) + '" y2="' + by.toFixed(1) + '" stroke="#fff" stroke-width="5"/>';
    svg += '<line x1="' + ax.toFixed(1) + '" y1="' + ay.toFixed(1) + '" x2="' + tipX.toFixed(1) + '" y2="' + tipY.toFixed(1) + '" stroke="' + color + '" stroke-width="1.4"/>';
    svg += '<path d="M' + bx.toFixed(1) + ',' + by.toFixed(1) + ' A' + radius.toFixed(1) + ',' + radius.toFixed(1) + ' 0 0 ' + (cross > 0 ? 0 : 1) + ' ' + tipX.toFixed(1) + ',' + tipY.toFixed(1) + '" fill="none" stroke="' + color + '" stroke-width="0.8" stroke-dasharray="3 2"/>';
  });

  /* Overall dimensions */
  svg += '<text x="225" y="18" font-size="10" font-family="monospace" font-weight="600" text-anchor="middle" fill="#2563eb">WIDTH ' + formatLength(envelope.W) + '   ·   DEPTH ' + formatLength(envelope.D) + '</text>';
  return svg + '</svg>';
}

function sheetHtml(plan, showNotes) {
  const m = plan.summary, e = plan.envelope;
  let h = '<div class="sheet"><h2>' + plan.variant.name + '</h2><div class="sub">' + plan.subtitle + ' · ' + formatLength(e.W) + ' × ' + formatLength(e.D) + ' envelope</div>';
  h += '<div class="metrics">'
    + '<div class="metric"><span>Living area</span><b>' + formatArea(m.livingArea) + '</b></div>'
    + '<div class="metric"><span>Est. cost</span><b>' + formatMoney(m.cost) + '</b>' + (m.overBudget > 0 ? '+' + formatMoney(m.overBudget) + ' over budget' : 'Within budget') + '</div>'
    + '<div class="metric"><span>Size check</span><b>' + m.passCount + '/' + m.roomCount + '</b>' + m.hallPercent + '% hallway</div>'
    + '</div>';
  plan.floors.forEach(floor => {
    if (plan.floors.length > 1) h += '<div class="floor-label">' + floor.label + '</div>';
    h += floorSvg(floor, e);
  });
  if (showNotes) h += '<div class="notes">' + plan.notes.map(n => '<div class="note">' + n + '</div>').join('') + '</div>';
  return h + '</div>';
}

function render() {
  const mount = $('mount');
  if (!plans.length) { mount.innerHTML = ''; return; }
  $('tabs').innerHTML = VARIANTS.map((v, i) => '<button class="btn' + (activeTab === i ? ' active' : '') + '" data-tab="' + i + '" type="button">' + v.name + '</button>').join('')
    + '<button class="btn' + (activeTab === 'all' ? ' active' : '') + '" data-tab="all" type="button">Compare all</button>';
  mount.innerHTML = activeTab === 'all'
    ? '<div class="grid">' + plans.map(p => sheetHtml(p, false)).join('') + '</div>'
    : sheetHtml(plans[activeTab], true);
}

function refresh() {
  try {
    applySizeMode();
    updateLabels();
    plans = buildAllPlans(readSettings());
    render();
  } catch (err) {
    console.error(err);
    $('mount').innerHTML = '<div class="sheet error"><b>Could not build a plan:</b> ' + err.message + '</div>';
  }
}

function downloadFile(name, text, type) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([text], { type: type }));
  link.download = name;
  document.body.appendChild(link); link.click(); link.remove();
}

function setUnits(metric) {
  useMetric = metric;
  $('unitImperial').classList.toggle('active', !metric);
  $('unitMetric').classList.toggle('active', metric);
  updateLabels();
  render();
}

function init() {
  $('sidebar').addEventListener('input', refresh);
  $('sidebar').addEventListener('change', refresh);
  $('tabs').addEventListener('click', e => {
    const button = e.target.closest('button');
    if (!button) return;
    activeTab = button.dataset.tab === 'all' ? 'all' : +button.dataset.tab;
    render();
  });
  $('unitImperial').addEventListener('click', () => setUnits(false));
  $('unitMetric').addEventListener('click', () => setUnits(true));
  $('printPage').addEventListener('click', () => window.print());
  $('saveJson').addEventListener('click', () => {
    if (!plans.length) return;
    const plan = plans[activeTab === 'all' ? 0 : activeTab];
    downloadFile('floorplan_' + plan.variant.name.slice(-1) + '.json',
      JSON.stringify({ settings: plan.settings, envelope: plan.envelope, floors: plan.floors }, null, 2), 'application/json');
  });
  refresh();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
